spring.application.name=websitesekolah

# ==== Database (PostgreSQL) ====
# Ganti sesuai environment kamu (bisa juga pakai environment variable seperti di bawah)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/school_web_pg}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==== JPA / Hibernate ====
# Tabel sudah dibuat manual sesuai skema yang diberikan, jadi pakai "validate"
# supaya Hibernate hanya memvalidasi entity cocok dengan tabel, tidak mengubah DB.
# Kalau kamu mau Hibernate ikut generate/update skema saat development, ganti ke "update".
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.open-in-view=false

# ==== JWT ====
# Ganti secret ini dengan string acak yang panjang & aman untuk production
jwt.secret=${JWT_SECRET:cGxlYXNlLWNoYW5nZS10aGlzLXNlY3JldC1rZXktbWluaW11bS0yNTYtYml0cy1sb25n}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==== File upload (untuk image_path bila kamu tambah endpoint upload nanti) ====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

server.port=${SERVER_PORT:5173}
